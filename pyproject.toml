[tool.black]
line-length = 88

[project]
name = "sit_fuse"
dynamic = ["version"]
dependencies = [
    # Pinned after myoArmReachFixed-v0's observation dimension silently
    # changed from 78 to 80 dims on an unpinned myosuite upgrade (surfaced
    # as a cryptic Gibbs-sampling tensor-shape mismatch, not an install
    # error -- see rtdbn.n_visible's fail-fast check in
    # sit_fuse/train/pretrain_rtdbn.py). Every RTDBN/PLOS-track dataset and
    # result in this repo was generated under these exact versions; bump
    # deliberately and regenerate data if a newer version is ever needed,
    # not by letting this float.
    "myosuite==2.12.2",
    "gymnasium==1.2.3",
]


[build-system]
requires = ["setuptools>=43.0.0"]
build-backend = "setuptools.build_meta"


